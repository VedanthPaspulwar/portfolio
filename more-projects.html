<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>More Projects — Visual Sequence | Vedanth</title>
  <meta name="description" content="Cinematic 300-frame scroll-scrubbed interactive sequence by Vedanth.">
  <meta name="theme-color" content="#060608">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      min-height: 100%;
      overflow-y: scroll;
      overflow-x: hidden;
      background-color: #060608;
    }

    body {
      width: 100%;
      min-height: 550vh;
      height: 550vh;
      background-color: #060608;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Minimal Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #060608;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 245, 255, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00f5ff;
    }

    /* Fixed Fullscreen Canvas */
    #scrollCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      background: #060608;
      pointer-events: none; /* Allows wheel & scroll to pass cleanly */
    }

    /* Top Clickable Interactive Progress Bar */
    .progress-bar-wrap {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 100;
      cursor: pointer;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f5ff 0%, #0077ff 60%, #ff007f 100%);
      box-shadow: 0 0 12px rgba(0, 245, 255, 0.85);
      transition: width 0.04s linear;
    }

    /* Top Floating Controls Bar */
    .top-bar {
      position: fixed;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 90;
      pointer-events: none;
    }

    .btn-back {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      background: rgba(12, 10, 16, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9999px;
      color: #ffffff;
      font-size: 0.86rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .btn-back:hover {
      background: rgba(0, 245, 255, 0.16);
      border-color: #00f5ff;
      color: #00f5ff;
      transform: translateX(-3px);
      box-shadow: 0 8px 32px rgba(0, 245, 255, 0.35);
    }

    .btn-back .back-arrow {
      transition: transform 0.2s ease;
    }

    .btn-back:hover .back-arrow {
      transform: translateX(-3px);
    }

    /* Frame Counter Pill */
    .frame-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(12, 10, 16, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.85);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .frame-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00f5ff;
      box-shadow: 0 0 8px #00f5ff;
      animation: pulseGlow 1.8s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    .frame-num {
      color: #00f5ff;
      font-weight: 700;
    }

    /* Floating Scroll Instruction Pill at Bottom */
    .scroll-hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      background: rgba(12, 10, 16, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.8);
      z-index: 90;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .scroll-hint.hidden {
      opacity: 0;
      transform: translate(-50%, 15px);
    }

    .scroll-icon {
      display: inline-block;
      animation: bounceDown 1.8s infinite ease-in-out;
      color: #00f5ff;
      font-weight: 800;
    }

    @keyframes bounceDown {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Frame Scrubber Canvas -->
  <canvas id="scrollCanvas"></canvas>

  <!-- Top Progress Bar (Clickable to jump) -->
  <div class="progress-bar-wrap" id="progressWrap" title="Click anywhere to jump in sequence">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- Top Floating Controls -->
  <header class="top-bar">
    <a href="projects.html" class="btn-back">
      <span class="back-arrow">←</span>
      <span>Projects Deck</span>
    </a>

    <div class="frame-pill">
      <span class="frame-dot"></span>
      <span>Frame <span class="frame-num" id="frameDisplay">001</span> / 300</span>
    </div>
  </header>

  <!-- Scroll Hint Pill -->
  <div class="scroll-hint" id="scrollHint">
    <span>Scroll or Drag down to play sequence</span>
    <span class="scroll-icon">↓</span>
  </div>

  <script>
    (function () {
      'use strict';

      const TOTAL_FRAMES = 300;
      const canvas = document.getElementById('scrollCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const progressBar = document.getElementById('progressBar');
      const progressWrap = document.getElementById('progressWrap');
      const frameDisplay = document.getElementById('frameDisplay');
      const scrollHint = document.getElementById('scrollHint');

      const frames = new Array(TOTAL_FRAMES);
      let targetFrame = 0;
      let currentFrame = 0;
      let lastRenderedIndex = 0;
      let dpr = 1;

      function getFramePath(index) {
        const num = String(index + 1).padStart(3, '0');
        return `more-frames/ezgif-frame-${num}.jpg`;
      }

      // Preload all frames progressively
      function init() {
        for (let i = 0; i < TOTAL_FRAMES; i++) {
          const img = new Image();
          img.onload = () => {
            // If this is the current target frame, render immediately
            if (Math.round(currentFrame) === i) {
              render(i);
            }
          };
          img.src = getFramePath(i);
          frames[i] = img;
        }

        // Render frame 0 as soon as it loads
        if (frames[0]) {
          if (frames[0].complete && frames[0].naturalWidth > 0) {
            render(0);
          } else {
            frames[0].onload = () => render(0);
          }
        }
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(window.innerWidth * dpr);
        canvas.height = Math.round(window.innerHeight * dpr);
        render(Math.round(currentFrame));
      }

      function getBestImage(idx) {
        let img = frames[idx];
        if (img && img.complete && img.naturalWidth > 0) {
          lastRenderedIndex = idx;
          return img;
        }

        // Search closest loaded neighbor to prevent blank/flicker
        for (let offset = 1; offset < TOTAL_FRAMES; offset++) {
          const prev = idx - offset;
          if (prev >= 0 && frames[prev]?.complete && frames[prev]?.naturalWidth > 0) {
            lastRenderedIndex = prev;
            return frames[prev];
          }
          const next = idx + offset;
          if (next < TOTAL_FRAMES && frames[next]?.complete && frames[next]?.naturalWidth > 0) {
            lastRenderedIndex = next;
            return frames[next];
          }
        }

        return frames[lastRenderedIndex] || frames[0];
      }

      function render(frameIdx) {
        const img = getBestImage(frameIdx);
        if (!img || !img.complete || img.naturalWidth === 0) return;

        const cw = canvas.width;
        const ch = canvas.height;

        ctx.fillStyle = '#060608';
        ctx.fillRect(0, 0, cw, ch);

        const imgW = img.naturalWidth;
        const imgH = img.naturalHeight;
        const imgRatio = imgW / imgH;
        const screenRatio = cw / ch;

        let dw, dh, dx, dy;

        // Cinematic Cover Fit (Full Edge-to-Edge)
        if (screenRatio > imgRatio) {
          dw = cw;
          dh = Math.round(cw / imgRatio);
          dx = 0;
          dy = Math.round((ch - dh) / 2);
        } else {
          dh = ch;
          dw = Math.round(ch * imgRatio);
          dx = Math.round((cw - dw) / 2);
          dy = 0;
        }

        ctx.drawImage(img, dx, dy, dw, dh);
      }

      // Calculate Scroll Progress
      function updateScroll() {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
        const scrollHeight = Math.max(
          document.body.scrollHeight,
          document.documentElement.scrollHeight,
          document.body.offsetHeight,
          document.documentElement.offsetHeight
        );
        const scrollable = scrollHeight - window.innerHeight;

        if (scrollable > 0) {
          const progress = Math.max(0, Math.min(1, scrollTop / scrollable));
          targetFrame = progress * (TOTAL_FRAMES - 1);
        }

        if (progressBar) {
          const pct = ((targetFrame / (TOTAL_FRAMES - 1)) * 100).toFixed(2);
          progressBar.style.width = pct + '%';
        }

        if (scrollHint) {
          if (scrollTop > 40) {
            scrollHint.classList.add('hidden');
          } else {
            scrollHint.classList.remove('hidden');
          }
        }
      }

      // Smooth Lerp Animation Loop (Buttery 60+ FPS)
      function tick() {
        const diff = targetFrame - currentFrame;
        if (Math.abs(diff) > 0.001) {
          currentFrame += diff * 0.16;
          const rounded = Math.round(currentFrame);
          render(rounded);

          if (frameDisplay) {
            frameDisplay.textContent = String(rounded + 1).padStart(3, '0');
          }
        }
        requestAnimationFrame(tick);
      }

      // Interactive Click/Tap on Progress Bar to jump in sequence
      if (progressWrap) {
        progressWrap.addEventListener('click', (e) => {
          const rect = progressWrap.getBoundingClientRect();
          const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
          const scrollHeight = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight
          ) - window.innerHeight;
          window.scrollTo({ top: ratio * scrollHeight, behavior: 'smooth' });
        });
      }

      // Keyboard Controls (Arrow keys, Space, PageUp/Down)
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
          window.scrollBy({ top: 180, behavior: 'smooth' });
        } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
          window.scrollBy({ top: -180, behavior: 'smooth' });
        }
      });

      // Mouse drag scrub support
      let isDragging = false;
      let startY = 0;
      let startScroll = 0;

      window.addEventListener('mousedown', (e) => {
        if (e.target.closest('a') || e.target.closest('#progressWrap')) return;
        isDragging = true;
        startY = e.clientY;
        startScroll = window.pageYOffset || document.documentElement.scrollTop;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const delta = (startY - e.clientY) * 2.5;
        window.scrollTo({ top: startScroll + delta });
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });

      window.addEventListener('resize', resize, { passive: true });
      window.addEventListener('scroll', updateScroll, { passive: true });

      init();
      resize();
      updateScroll();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
