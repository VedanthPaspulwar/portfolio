<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinematic Ocean Exploration UI — Vedanth</title>
  <meta name="description" content="Cinematic Ocean Exploration UI concept & interactive 300-frame scroll-scrubbed engineering sequence by Vedanth Paspulwar.">
  <meta name="theme-color" content="#060608">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      min-height: 100%;
      overflow-y: scroll;
      overflow-x: hidden;
      background-color: #060608;
    }

    body {
      width: 100%;
      min-height: 480vh;
      background-color: #060608;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Minimal Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #060608;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 245, 255, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00f5ff;
    }

    /* Fixed Fullscreen Background Canvas (300 Frames) */
    #scrollCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      background: #060608;
      pointer-events: none;
    }

    /* Subtle Dark Vignette & Screen Tint for High Contrast */
    .canvas-overlay-tint {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(ellipse at 50% 45%, rgba(6, 6, 8, 0.45) 0%, rgba(6, 6, 8, 0.85) 85%);
      pointer-events: none;
      z-index: 2;
    }

    /* Top Clickable Interactive Progress Bar */
    .progress-bar-wrap {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 100;
      cursor: pointer;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f5ff 0%, #0077ff 60%, #ff007f 100%);
      box-shadow: 0 0 12px rgba(0, 245, 255, 0.85);
      transition: width 0.04s linear;
    }

    /* Top Floating Navigation Bar */
    .top-bar {
      position: fixed;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 90;
      pointer-events: none;
    }

    .btn-back {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      background: rgba(12, 10, 16, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9999px;
      color: #ffffff;
      font-size: 0.86rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .btn-back:hover {
      background: rgba(0, 245, 255, 0.16);
      border-color: #00f5ff;
      color: #00f5ff;
      transform: translateX(-3px);
      box-shadow: 0 8px 32px rgba(0, 245, 255, 0.35);
    }

    .btn-back .back-arrow {
      transition: transform 0.2s ease;
    }

    .btn-back:hover .back-arrow {
      transform: translateX(-3px);
    }

    /* Frame Counter Pill */
    .frame-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(12, 10, 16, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.85);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .frame-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00f5ff;
      box-shadow: 0 0 8px #00f5ff;
      animation: pulseGlow 1.8s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    .frame-num {
      color: #00f5ff;
      font-weight: 700;
    }

    /* Main Showcase Content Container (Floats over scrubbing canvas) */
    .showcase-scroll-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 120px 24px 60px;
      pointer-events: auto;
    }

    /* Featured Cinematic Showcase Section (Matches Reference Image) */
    .cinematic-showcase-section {
      display: flex;
      flex-direction: column;
      gap: 36px;
      margin-bottom: 70vh; /* Smooth spacing for sequence scrubbing */
    }

    /* Header: Eyebrow + Large Title */

      text-align: left;
    }

    .showcase-eyebrow {

      font-size: 0.85rem;

    .showcase-title {

    /* Center Mockup Container with Glow */
    .showcase-mockup-container {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 12px 0 20px;
    }

    .mockup-glow-ambient {
      position: absolute;
      width: 75%;
      height: 75%;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.22) 0%, rgba(0, 100, 220, 0.08) 55%, transparent 75%);
      filter: blur(50px);
      z-index: 1;
      pointer-events: none;
    }

    .mockup-glass-frame {
      position: relative;
      z-index: 2;
      width: 100%;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(12, 10, 16, 0.4);

    .mockup-glass-frame:hover {

      box-shadow: 0 35px 95px rgba(0, 0, 0, 0.9), 0 0 60px rgba(0, 245, 255, 0.3);

    .mockup-image {
      display: block;

    /* Bottom Info Strip: Vedanth Information (Minimal & Clean) */
    .showcase-footer-strip {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 28px;

    .footer-strip-left {

    .footer-strip-headline {

    .footer-strip-right {

    .footer-contact-link {

      font-size: 0.82rem;

      text-decoration: none;
      padding: 10px 18px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);

    }

    .footer-contact-link:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
    }

    .contact-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00f5ff;
      box-shadow: 0 0 6px #00f5ff;
    }

    .footer-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 26px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #00f5ff, #0077ff);
      color: #060608;
      font-weight: 800;
      font-size: 0.88rem;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(0, 245, 255, 0.35);
      transition: all 0.25s ease;
    }

    .footer-action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 245, 255, 0.6);
    }

    .btn-arrow {
      font-size: 1rem;
      transition: transform 0.2s ease;
    }

    .footer-action-btn:hover .btn-arrow {
      transform: translateX(3px);
    }

    /* Bottom Floating Scroll Hint */
    .scroll-hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      background: rgba(12, 10, 16, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.8);
      z-index: 90;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .scroll-hint.hidden {
      opacity: 0;
      transform: translate(-50%, 15px);
    }

    .scroll-icon {
      display: inline-block;
      animation: bounceDown 1.8s infinite ease-in-out;
      color: #00f5ff;
      font-weight: 800;
    }

    @keyframes bounceDown {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }

    /* End Gateway: Next to 3D Particle Cloud */
    .end-gateway-card {
      margin-top: 100vh;
      margin-bottom: 40px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .btn-gateway {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      width: 100%;
      padding: 24px 32px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(0, 245, 255, 0.1) 100%);
      border: 1px solid rgba(0, 245, 255, 0.3);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-decoration: none;
      color: #ffffff;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }

    .btn-gateway:hover {
      transform: translateY(-4px);
      border-color: #00f5ff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 245, 255, 0.35);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(0, 245, 255, 0.2) 100%);
    }

    .gateway-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      color: #00f5ff;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }

    .gateway-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .gateway-arrow {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #00f5ff;
      color: #060608;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 800;
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }

    .btn-gateway:hover .gateway-arrow {
      transform: translateX(4px);
    }

    @media (max-width: 768px) {
      .showcase-scroll-wrapper {
        padding: 100px 18px 40px;
      }
      .showcase-footer-strip {
        flex-direction: column;
        align-items: flex-start;
      }
      .footer-strip-right {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>

<body>

  <!-- Fixed Fullscreen Frame Scrubber Canvas -->
  <canvas id="scrollCanvas"></canvas>
  <div class="canvas-overlay-tint"></div>

  <!-- Top Progress Bar (Clickable to jump) -->
  <div class="progress-bar-wrap" id="progressWrap" title="Click anywhere to jump in sequence">

  </div>

  <!-- Top Floating Controls -->
  <header class="top-bar">

      <span>Frame <span class="frame-num" id="frameDisplay">001</span> / 300</span>

  </header>

  <!-- Main Scrollable Content Overlay -->
  <div class="showcase-scroll-wrapper">

    <!-- Featured Section (Matches User Reference Image) -->
    <section class="cinematic-showcase-section">
      <!-- Top Title Group -->
      <div class="showcase-header">
        <span class="showcase-eyebrow">LANDING PAGE CONCEPT</span>
        <h1 class="showcase-title">Cinematic Ocean<br>Exploration UI</h1>
      </div>

      <!-- Center Transparent Mockup Card -->
      <div class="showcase-mockup-container">
        <div class="mockup-glow-ambient"></div>
        <div class="mockup-glass-frame">
          <img src="ocean_mockup.png" alt="Cinematic Ocean Exploration UI Mockup" class="mockup-image">
        </div>
      </div>

      <!-- Bottom Vedanth Info Strip (Minimal & Clean) -->
      <div class="showcase-footer-strip">
        <div class="footer-strip-left">
          <h2 class="footer-strip-headline">Vedanth Paspulwar</h2>
          <p class="footer-strip-sub">Frontend &amp; C++ Systems Developer • B.Tech CSE</p>
        </div>

        <div class="footer-strip-right">
          <a href="mailto:paspulwarvedanth5@gmail.com" class="footer-contact-link">
            <span class="contact-dot"></span>
            <span>paspulwarvedanth5@gmail.com</span>
          </a>
          <a href="https://wa.me/917385038223" target="_blank" rel="noopener noreferrer" class="footer-action-btn">
            <span>Get in touch</span>
            <span class="btn-arrow">→</span>
          </a>
        </div>
      </div>
    </section>

    <!-- End Gateway: Next to 3D Particle Cloud -->
    <div class="end-gateway-card">
      <a href="particles.html" class="btn-gateway">
        <div>
          <span class="gateway-tag">// NEXT EXPERIENCE</span>
          <h3 class="gateway-title">Interactive 3D Particle Cloud</h3>
        </div>
        <span class="gateway-arrow">→</span>
      </a>
    </div>

  </div>

  <!-- Scroll Hint Pill -->
  <div class="scroll-hint" id="scrollHint">
    <span>Scroll down to play 300-frame sequence</span>
    <span class="scroll-icon">↓</span>
  </div>

  <script>
    (function () {
      'use strict';

      const TOTAL_FRAMES = 300;
      const canvas = document.getElementById('scrollCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const progressBar = document.getElementById('progressBar');
      const progressWrap = document.getElementById('progressWrap');
      const frameDisplay = document.getElementById('frameDisplay');
      const scrollHint = document.getElementById('scrollHint');

      const frames = new Array(TOTAL_FRAMES);
      let targetFrame = 0;
      let currentFrame = 0;
      let lastRenderedIndex = 0;
      let dpr = 1;

      function getFramePath(index) {
        const num = String(index + 1).padStart(3, '0');
        return `more-frames/ezgif-frame-${num}.jpg`;
      }

      // Preload all frames progressively
      function init() {
        for (let i = 0; i < TOTAL_FRAMES; i++) {
          const img = new Image();
          img.onload = () => {
            if (Math.round(currentFrame) === i) {
              render(i);
            }
          };
          img.src = getFramePath(i);
          frames[i] = img;
        }

        // Render frame 0 immediately
        if (frames[0]) {
          if (frames[0].complete && frames[0].naturalWidth > 0) {
            render(0);
          } else {
            frames[0].onload = () => render(0);
          }
        }
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(window.innerWidth * dpr);
        canvas.height = Math.round(window.innerHeight * dpr);
        render(Math.round(currentFrame));
      }

      function getBestImage(idx) {
        let img = frames[idx];
        if (img && img.complete && img.naturalWidth > 0) {
          lastRenderedIndex = idx;
          return img;
        }

        // Search closest loaded neighbor to prevent flicker
        for (let offset = 1; offset < TOTAL_FRAMES; offset++) {
          const prev = idx - offset;
          if (prev >= 0 && frames[prev]?.complete && frames[prev]?.naturalWidth > 0) {
            lastRenderedIndex = prev;
            return frames[prev];
          }
          const next = idx + offset;
          if (next < TOTAL_FRAMES && frames[next]?.complete && frames[next]?.naturalWidth > 0) {
            lastRenderedIndex = next;
            return frames[next];
          }
        }

        return frames[lastRenderedIndex] || frames[0];
      }

      function render(frameIdx) {
        const img = getBestImage(frameIdx);
        if (!img || !img.complete || img.naturalWidth === 0) return;

        const cw = canvas.width;
        const ch = canvas.height;

        ctx.fillStyle = '#060608';
        ctx.fillRect(0, 0, cw, ch);

        const imgW = img.naturalWidth;
        const imgH = img.naturalHeight;
        const imgRatio = imgW / imgH;
        const screenRatio = cw / ch;

        let dw, dh, dx, dy;

        // Cinematic Cover Fit (Full Edge-to-Edge)
        if (screenRatio > imgRatio) {
          dw = cw;
          dh = Math.round(cw / imgRatio);
          dx = 0;
          dy = Math.round((ch - dh) / 2);
        } else {
          dh = ch;
          dw = Math.round(ch * imgRatio);
          dx = Math.round((cw - dw) / 2);
          dy = 0;
        }

        ctx.drawImage(img, dx, dy, dw, dh);
      }

      // Calculate Scroll Progress
      function updateScroll() {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
        const scrollHeight = Math.max(
          document.body.scrollHeight,
          document.documentElement.scrollHeight,
          document.body.offsetHeight,
          document.documentElement.offsetHeight
        );
        const scrollable = scrollHeight - window.innerHeight;

        if (scrollable > 0) {
          const progress = Math.max(0, Math.min(1, scrollTop / scrollable));
          targetFrame = progress * (TOTAL_FRAMES - 1);
        }

        if (progressBar) {
          const pct = ((targetFrame / (TOTAL_FRAMES - 1)) * 100).toFixed(2);
          progressBar.style.width = pct + '%';
        }

        if (scrollHint) {
          if (scrollTop > 40) {
            scrollHint.classList.add('hidden');
          } else {
            scrollHint.classList.remove('hidden');
          }
        }
      }

      // Smooth Lerp Animation Loop (60+ FPS)
      function tick() {
        const diff = targetFrame - currentFrame;
        if (Math.abs(diff) > 0.001) {
          currentFrame += diff * 0.16;
          const rounded = Math.round(currentFrame);
          render(rounded);

          if (frameDisplay) {
            frameDisplay.textContent = String(rounded + 1).padStart(3, '0');
          }
        }
        requestAnimationFrame(tick);
      }

      // Interactive Click/Tap on Progress Bar to jump in sequence
      if (progressWrap) {
        progressWrap.addEventListener('click', (e) => {
          const rect = progressWrap.getBoundingClientRect();
          const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
          const scrollHeight = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight
          ) - window.innerHeight;
          window.scrollTo({ top: ratio * scrollHeight, behavior: 'smooth' });
        });
      }

      // Keyboard Controls
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
          window.scrollBy({ top: 180, behavior: 'smooth' });
        } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
          window.scrollBy({ top: -180, behavior: 'smooth' });
        }
      });

      window.addEventListener('resize', resize, { passive: true });
      window.addEventListener('scroll', updateScroll, { passive: true });

      init();
      resize();
      updateScroll();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
